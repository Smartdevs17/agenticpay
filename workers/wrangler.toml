name = "agenticpay-edge"
main = "src/index.ts"
compatibility_date = "2026-04-23"

[[kv_namespaces]]
binding = "USER_SESSIONS"
id = "YOUR_KV_NAMESPACE_ID"

[[kv_namespaces]]
binding = "EDGE_CACHE"
id = "YOUR_KV_CACHE_ID"

# Mutual TLS client certificate presented on every backend call (#1474).
# Upload with `wrangler mtls-certificate upload --cert cert.pem --key key.pem`.
# Secrets: SERVICE_TOKEN_PRIVATE_KEY, SERVICE_TOKEN_KEY_ID, SERVICE_MTLS_CERT_SHA256
# (see docs/security/service-tokens.md).
[[mtls_certificates]]
binding = "BACKEND_MTLS"
certificate_id = "YOUR_MTLS_CERTIFICATE_ID"

# Warm-up cron triggers — keep critical backend endpoints warm to avoid cold starts.
# Runs every 5 minutes to prevent the backend from going idle.
# Set SOROBAN_RPC_URL as a Worker variable to also warm its outbound RPC connection.
[triggers]
crons = [
  "*/5 * * * *",   # warm-up ping every 5 minutes
]
