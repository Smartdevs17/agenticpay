name: SDK Documentation

on:
  pull_request:
    paths:
      - 'packages/sdk/**'
      - 'packages/types/**'
      - '.github/workflows/sdk-docs.yml'
  push:
    branches: [main, dev]
    paths:
      - 'packages/sdk/**'
      - 'packages/types/**'

jobs:
  typedoc:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [sdk, types]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/${{ matrix.package }}/package-lock.json

      - name: Install
        working-directory: packages/${{ matrix.package }}
        run: npm ci 2>/dev/null || npm install

      - name: Build
        working-directory: packages/${{ matrix.package }}
        run: npm run build

      - name: Generate TypeDoc
        working-directory: packages/${{ matrix.package }}
        run: npm run docs

      - name: Upload docs artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typedoc-${{ matrix.package }}
          path: packages/${{ matrix.package }}/docs/api

  sdk-examples:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Compile examples
        run: npx tsc --noEmit examples/*.ts --module nodenext --moduleResolution nodenext --target ES2022
