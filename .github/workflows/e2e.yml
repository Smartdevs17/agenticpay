name: E2E

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      update_visual_snapshots:
        description: Re-record visual baselines and upload them as an artifact to commit
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE: agenticpay
  ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

jobs:
  # Only run if frontend changed (keeps the matrix off the critical path for
  # backend/contract-only PRs).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/e2e.yml'

  e2e:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome, mobile-safari]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --include=optional

      - name: Ensure Linux native packages are available
        if: runner.os == 'Linux'
        run: |
          LIGHTNINGCSS_VERSION=$(node -e "const fs=require('fs'); const path=require('path'); const pkg=path.join(path.dirname(path.dirname(require.resolve('lightningcss'))), 'package.json'); process.stdout.write(JSON.parse(fs.readFileSync(pkg, 'utf8')).version)")
          npm install --no-save \
            @rollup/rollup-linux-x64-gnu@$(node -p "require('rollup/package.json').version") \
            lightningcss-linux-x64-gnu@$LIGHTNINGCSS_VERSION \
            @tailwindcss/oxide-linux-x64-gnu@$(node -p "require('@tailwindcss/oxide/package.json').version")

      # Cache Playwright browser binaries. Key on the installed @playwright/test
      # version so upgrades automatically invalidate.
      - name: Resolve Playwright version
        id: pw-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.project == 'firefox' && 'firefox' || matrix.project == 'webkit' && 'webkit' || matrix.project == 'mobile-safari' && 'webkit' || 'chromium' }}

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }}
        env:
          CI: 'true'

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.project }}
          path: frontend/playwright-report
          retention-days: 14

      - name: Upload traces & videos
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-trace-${{ matrix.project }}
          path: frontend/test-results
          retention-days: 14

  # Pixel comparison of dashboard pages against baselines committed under
  # frontend/tests/e2e/visual/__screenshots__. Runs in the Playwright image so
  # rendering matches `npm run test:visual:docker` exactly. See
  # frontend/tests/e2e/visual/README.md.
  visual:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # Keep in sync with @playwright/test in frontend/package-lock.json.
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-visual-npm-${{ hashFiles('frontend/package-lock.json', 'package-lock.json') }}

      - name: Run visual regression
        env:
          CI: 'true'
        run: >-
          frontend/tests/e2e/visual/run.sh
          ${{ inputs.update_visual_snapshots && '--update-snapshots' || '' }}

      - name: Summarise snapshot diffs
        if: ${{ !cancelled() }}
        run: |
          results=frontend/test-results/visual/results.json
          [ -f "$results" ] || exit 0
          node -e '
            const r = require(process.argv[1]);
            const failed = [];
            const walk = (s) => { (s.suites || []).forEach(walk); (s.specs || []).forEach((sp) => sp.tests.forEach((t) => {
              if (t.status === "unexpected") failed.push(`| ${t.projectName} | ${sp.title} |`);
            })); };
            r.suites.forEach(walk);
            const { expected = 0, unexpected = 0, flaky = 0 } = r.stats;
            const lines = [`### Visual regression: ${expected} passed, ${unexpected} failed, ${flaky} flaky`];
            if (failed.length) lines.push("", "| Project | Test |", "| --- | --- |", ...failed, "",
              "Download the **visual-report** artifact and open `index.html` to compare expected / actual / diff.",
              "If the change is intended, re-record with `npm run test:visual:docker -- --update-snapshots`.");
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          ' "$PWD/$results"

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-report
          path: frontend/playwright-report/visual
          retention-days: 14

      - name: Upload re-recorded baselines
        if: ${{ inputs.update_visual_snapshots }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-baselines
          path: frontend/tests/e2e/visual/__screenshots__
          retention-days: 7
