name: Size Limit

on:
  pull_request:
    paths:
      - 'frontend/app/**'
      - 'frontend/components/**'
      - 'frontend/lib/**'
      - 'frontend/next.config.ts'
      - 'frontend/bundle-budget.json'
      - 'frontend/package.json'
      - '.size-limit.json'
  push:
    branches:
      - main
    paths:
      - 'frontend/app/**'
      - 'frontend/components/**'
      - 'frontend/next.config.ts'

jobs:
  size-limit:
    name: Bundle size budgets and regression alerts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          SIZE_LIMIT: 'true'

      - name: Enforce bundle budgets
        run: npm run bundle:check

      - name: Report size regressions on pull requests
        if: github.event_name == 'pull_request'
        uses: andresz1/size-limit-action@e7493a72a44b113341c0cf6186ab49c17c4b65c1 # v1.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          directory: frontend
          config_path: .size-limit.json
