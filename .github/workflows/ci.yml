name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# ── Auto-scaling: cancel redundant runs on the same branch/PR ────────────────
# This is the primary cost-saving mechanism for CI: only the most recent
# push on a branch consumes runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Resource tags emitted on every run ───────────────────────────────────────
# Downstream tooling (cost-monitor, dashboards) can filter by these values.
env:
  SERVICE: agenticpay
  ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
  COMMIT_SHORT: ${{ github.sha }}
  # ── Turborepo remote cache ───────────────────────────────────────────────
  # Builds run through turbo so identical inputs are restored from cache
  # instead of rebuilt. Set the TURBO_TOKEN / TURBO_REMOTE_CACHE_SIGNATURE_KEY
  # secrets and the TURBO_TEAM variable to enable the shared remote cache;
  # without them (e.g. fork PRs) turbo falls back to the per-job local cache.
  # Artifacts are HMAC-signed (turbo.json `remoteCache.signature`) so a
  # tampered remote artifact is rejected. TURBO_VERSION must match the
  # version locked in package-lock.json (pinned by scripts/turbo-config.test.mjs).
  TURBO_VERSION: 1.13.4
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_API: ${{ vars.TURBO_API || 'https://vercel.com/api' }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  # ── Detect changed paths (avoids running unaffected jobs) ─────────────────
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend:   ${{ steps.filter.outputs.backend }}
      frontend:  ${{ steps.filter.outputs.frontend }}
      contracts: ${{ steps.filter.outputs.contracts }}
      tooling:   ${{ steps.filter.outputs.tooling }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            contracts:
              - 'contracts/**'
            tooling:
              - 'turbo.json'
              - 'Makefile'
              - 'package.json'
              - 'package-lock.json'
              - 'scripts/**'
              - 'docs/**'
              - 'commitlint.config.js'
              - '.husky/**'
              - '.releaserc.json'
              - '.github/CODEOWNERS'
              # Any workflow or Dependabot change re-runs the action-pin
              # policy in scripts/workflow-pins.test.mjs (#1468).
              - '.github/workflows/**'
              - '.github/dependabot.yml'
              - 'infra/sentry/**'

  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    name: Backend (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    # Auto-scaling: cap concurrent backend matrix jobs to avoid runner exhaustion.
    # With a 2-version matrix, max 2 jobs run simultaneously per branch.
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20, 22]
      # Don't cancel the entire matrix on a single failure — let all versions report
      fail-fast: false
      # Auto-scale: limit simultaneous matrix jobs.
      # Raise to 2 (or remove) if faster turnaround is preferred over cost savings.
      max-parallel: 2
    env:
      # Part of turbo's global hash so each matrix leg keeps its own artifacts.
      NODE_VERSION: ${{ matrix.node-version }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Cache the installed node_modules between runs with the same lock file.
      # This shaves ~30s off each run after the first on a given branch.
      - name: Cache node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-modules-node${{ matrix.node-version }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-modules-node${{ matrix.node-version }}-

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Lint changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- backend/src/ | grep '\.ts$' | tr '\n' ' ')
          else
            CHANGED=$(git diff --name-only HEAD^ HEAD -- backend/src/ | grep '\.ts$' | tr '\n' ' ')
          fi
          if [ -n "$CHANGED" ]; then
            echo "Linting changed files: $CHANGED"
            npx eslint $CHANGED
          else
            echo "No backend source files changed — skipping lint"
          fi

      - name: Test changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- backend/src/ | grep '\.test\.ts$' | tr '\n' ' ')
          else
            CHANGED=$(git diff --name-only HEAD^ HEAD -- backend/src/ | grep '\.test\.ts$' | tr '\n' ' ')
          fi
          if [ -n "$CHANGED" ]; then
            echo "Testing changed files: $CHANGED"
            npx vitest run $CHANGED
          else
            echo "No backend test files changed — skipping tests"
          fi

      # Local fallback for turbo's cache when the remote cache is not configured.
      - name: Cache turbo artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-backend-node${{ matrix.node-version }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-backend-node${{ matrix.node-version }}-

      # turbo hashes the workspace inputs and replays dist/ on a cache hit,
      # so unchanged sources never rebuild.
      - name: Build
        working-directory: .
        run: npx --yes turbo@${TURBO_VERSION} run build --filter=agenticpay-backend --summarize

      - &turbo-cache-report
        name: Report turbo cache
        if: always()
        working-directory: .
        run: |
          SUMMARY=$(ls -t .turbo/runs/*.json 2>/dev/null | head -1)
          if [ -z "$SUMMARY" ]; then
            echo "No turbo run summary found — skipping cache report"
            exit 0
          fi
          node -e '
            const run = require(process.argv[1]);
            const label = `${process.env.GITHUB_JOB} (Node ${process.env.NODE_VERSION})`;
            const { cached, attempted } = run.execution;
            console.log(`::notice title=Turbo cache — ${label}::${cached}/${attempted} tasks restored from cache`);
            const rows = run.tasks.map((t) => `| ${t.taskId} | ${t.cache.status} | ${t.cache.source || "-"} | ${t.cache.timeSaved || 0} |`);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              [`### Turbo cache — ${label}`, "| Task | Status | Source | Time saved (ms) |", "| --- | --- | --- | --- |", ...rows, ""].join("\n"));
          ' "$PWD/$SUMMARY"

      # Emit build size as a workflow annotation (picked up by cost-monitor)
      - name: Report build size
        if: always()
        run: |
          if [ -d dist ]; then
            SIZE=$(du -sh dist | cut -f1)
            echo "::notice title=Backend Build Size (Node ${{ matrix.node-version }})::${SIZE}"
          fi

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    name: Frontend (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: [20, 22]
      fail-fast: false
      max-parallel: 2
    env:
      NODE_VERSION: ${{ matrix.node-version }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-modules-node${{ matrix.node-version }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-modules-node${{ matrix.node-version }}-

      # Next.js build cache (incremental compilation)
      - name: Cache Next.js build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/frontend/.next/cache
          key: ${{ runner.os }}-nextjs-node${{ matrix.node-version }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-node${{ matrix.node-version }}-${{ hashFiles('frontend/package-lock.json') }}-
            ${{ runner.os }}-nextjs-node${{ matrix.node-version }}-

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Lint changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- . | grep -E '\.(ts|tsx)$' | tr '\n' ' ')
          else
            CHANGED=$(git diff --name-only HEAD^ HEAD -- . | grep -E '\.(ts|tsx)$' | tr '\n' ' ')
          fi
          if [ -n "$CHANGED" ]; then
            echo "Linting changed files: $CHANGED"
            npx eslint $CHANGED
          else
            echo "No frontend source files changed — skipping lint"
          fi

      - name: Test changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- . | grep '\.test\.(ts|tsx)$' | tr '\n' ' ')
          else
            CHANGED=$(git diff --name-only HEAD^ HEAD -- . | grep '\.test\.(ts|tsx)$' | tr '\n' ' ')
          fi
          if [ -n "$CHANGED" ]; then
            echo "Testing changed files: $CHANGED"
            npx vitest run $CHANGED
          else
            echo "No frontend test files changed — skipping tests"
          fi

      - name: Cache turbo artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-frontend-node${{ matrix.node-version }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-frontend-node${{ matrix.node-version }}-

      - name: Build
        working-directory: .
        run: npx --yes turbo@${TURBO_VERSION} run build --filter=agenticpay-frontend --summarize

      - *turbo-cache-report

      - name: Report build size
        if: always()
        run: |
          if [ -d .next ]; then
            SIZE=$(du -sh --exclude=cache .next 2>/dev/null || du -sh .next | cut -f1)
            echo "::notice title=Frontend Build Size (Node ${{ matrix.node-version }})::${SIZE}"
          fi

  # ── Smart Contracts ───────────────────────────────────────────────────────
  contracts:
    needs: changes
    if: ${{ needs.changes.outputs.contracts == 'true' }}
    name: Smart Contracts (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "contracts -> target"

      - name: Build & Check
        working-directory: contracts
        run: |
          cargo build --target wasm32-unknown-unknown --release
          cargo check

  # ── Repo tooling (turbo config, Makefile, docs index, commitlint,
  #    CODEOWNERS, Sentry source-map upload) ──────────────────────────────
  tooling:
    needs: changes
    if: ${{ needs.changes.outputs.tooling == 'true' }}
    name: Repo tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # commitlint / semantic-release tests exercise the real CLIs.
      - name: Install root tooling
        run: npm ci --ignore-scripts --prefer-offline

      - name: Validate turbo pipeline graph
        run: npx --yes turbo@${TURBO_VERSION} run build lint test --dry=json > /dev/null

      - name: Test repo tooling
        run: make test-tooling

      # Offline tests can't tell whether an owner exists or has write access;
      # GitHub can. Unknown owners make their CODEOWNERS rule silently inert.
      - name: Validate CODEOWNERS against GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! errors=$(gh api "repos/${GITHUB_REPOSITORY}/codeowners/errors?ref=${REF}" --jq '.errors'); then
            echo "::warning title=CODEOWNERS::Could not query the CODEOWNERS errors API for ${REF}; skipping owner validation."
            exit 0
          fi
          if [ "$errors" != "[]" ]; then
            echo "$errors" | jq -r '.[] | "::error file=.github/CODEOWNERS,line=\(.line),col=\(.column)::\(.kind): \(.message)"'
            exit 1
          fi
          echo "CODEOWNERS: no errors reported by GitHub."
