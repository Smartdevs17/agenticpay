version: 2
updates:
  # Backend dependencies
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "mmesolove"
    assignees:
      - "mmesolove"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "backend"
    versioning-strategy: "increase"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      # Ignore major version updates for stability
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "mmesolove"
    assignees:
      - "mmesolove"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "frontend"
    versioning-strategy: "increase"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      # Ignore major version updates for stability
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Root package.json (if exists)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    reviewers:
      - "mmesolove"
    assignees:
      - "mmesolove"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "root"
    versioning-strategy: "increase"

  # GitHub Actions (#1468). Every workflow pins each action to a full commit
  # SHA with the release tag as a trailing comment, e.g.
  #   uses: actions/checkout@<40-char sha> # v4.4.0
  # Dependabot bumps the SHA and the comment together. Minor and patch bumps
  # arrive as one grouped PR; a major bump gets its own PR so its changelog
  # can be reviewed. scripts/workflow-pins.test.mjs fails CI on any unpinned
  # `uses:` reference.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

# Security updates are not configured in this file: Dependabot v2 rejects
# unknown top-level keys, and the former `security-updates:` block made the
# whole config invalid. Enable "Dependabot security updates" under
# Settings > Code security instead; they then cover every ecosystem above.
