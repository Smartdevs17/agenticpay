apiVersion: v1
kind: ServiceAccount
metadata:
  name: agenticpay-backend
  namespace: agenticpay
  labels:
    app: agenticpay-backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agenticpay-backend
  namespace: agenticpay
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agenticpay-backend
  namespace: agenticpay
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agenticpay-backend
subjects:
- kind: ServiceAccount
  name: agenticpay-backend
  namespace: agenticpay
