apiVersion: v1
kind: ConfigMap
metadata:
  name: agenticpay-config
  namespace: agenticpay
  labels:
    app: agenticpay-backend
data:
  LOG_LEVEL: "info"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "1000"
  CORS_ALLOWED_ORIGINS: "https://agenticpay.example.com,https://app.agenticpay.example.com"
  COMPRESSION_THRESHOLD: "1024"
  QUERY_LOG_SLOW_MS: "100"
  QUERY_LOG_CRITICAL_MS: "2000"
  SLA_MAX_RESPONSE_TIME_MS: "1000"
  SLA_MAX_ERROR_RATE_PERCENT: "5"
  SLA_MIN_UPTIME_PERCENT: "99.5"
  DATADOG_ENABLED: "true"
  DATADOG_HOST: "datadog-agent.datadog.svc.cluster.local"
  DATADOG_PORT: "8125"
