apiVersion: v1
kind: Secret
metadata:
  name: agenticpay-secrets
  namespace: agenticpay
  labels:
    app: agenticpay-backend
type: Opaque
stringData:
  # Database connection string
  database-url: "postgresql://user:password@agenticpay-postgres.default.svc.cluster.local:5432/agenticpay"

  # Redis connection string
  redis-url: "redis://default:password@agenticpay-redis.default.svc.cluster.local:6379"

  # OpenAI API key
  openai-api-key: "sk-..."

  # Stellar network keys
  stellar-public-key: ""
  stellar-secret-key: ""

  # JWT secret
  jwt-secret: ""

  # Stripe API keys
  stripe-secret-key: ""
  stripe-publishable-key: ""

  # Datadog API key
  datadog-api-key: ""

# NOTE: Replace placeholder values before deploying
# To create this secret:
# kubectl create secret generic agenticpay-secrets \
#   --from-literal=database-url="..." \
#   --from-literal=redis-url="..." \
#   --from-literal=openai-api-key="..." \
#   -n agenticpay
