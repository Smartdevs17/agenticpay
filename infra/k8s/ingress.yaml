apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agenticpay-ingress
  namespace: agenticpay
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - agenticpay.example.com
    secretName: agenticpay-tls
  rules:
  - host: agenticpay.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: agenticpay-backend
            port:
              number: 80
