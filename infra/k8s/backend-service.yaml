apiVersion: v1
kind: Service
metadata:
  name: agenticpay-backend
  namespace: agenticpay
  labels:
    app: agenticpay-backend
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: agenticpay-backend
  sessionAffinity: None
